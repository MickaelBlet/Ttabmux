[settings]
sidebar = 30
shell = /bin/zsh
title = Dev
fg = bright-white
bg = 24
no_hover = true

# Sessions: 'command' must appear before vsplit/hsplit/wide
[session:editor]
command = vim

[session:shell]
command = /bin/zsh
rename =
vsplit = htop
hsplit = tail -f /var/log/syslog
wide = 200

[session:build]
command = make
